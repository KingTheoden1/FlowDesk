services:
  postgres:
    image: postgres:16
    container_name: flowdesk-db
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk_dev
      POSTGRES_DB: flowdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: